<div
  class="min-h-[calc(100vh-4.5rem)] flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-gray-100 dark:bg-zinc-950 transition-colors"
>
  <div
    class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl border border-gray-200 dark:border-zinc-800 p-6 sm:p-8 shadow-sm"
  >
    <!-- Header -->
    <div class="text-center mb-6">
      <div
        class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-600 to-blue-500 text-white shadow-md mb-3"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
          <path d="M15 3v18" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
        Witaj w Gantry
      </h1>
      <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">
        Zaloguj się, aby uzyskać dostęp do tablicy zadań i projektów
      </p>
    </div>

    <!-- Error message -->
    @if (errorMessage()) {
      <div
        class="mb-4 p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 text-xs flex items-center gap-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit($event)" class="space-y-4">
      <div>
        <label
          for="login-email"
          class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Adres e-mail
        </label>
        <div class="relative">
          <input
            id="login-email"
            name="email"
            type="email"
            required
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="nazwa@przyklad.pl"
            class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-700 bg-gray-50/60 dark:bg-zinc-800/60 text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 focus:outline-hidden focus:ring-2 focus:ring-sky-500 dark:focus:ring-sky-400 transition"
          />
          <div
            class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect width="20" height="16" x="2" y="4" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </div>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label
            for="login-password"
            class="block text-xs font-medium text-gray-700 dark:text-gray-300"
          >
            Hasło
          </label>
          <span class="text-[11px] text-sky-600 dark:text-sky-400 hover:underline cursor-pointer">
            (dowolne hasło demo)
          </span>
        </div>
        <div class="relative">
          <input
            id="login-password"
            name="password"
            type="password"
            required
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="Wprowadź hasło"
            class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-700 bg-gray-50/60 dark:bg-zinc-800/60 text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 focus:outline-hidden focus:ring-2 focus:ring-sky-500 dark:focus:ring-sky-400 transition"
          />
          <div
            class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 active:bg-sky-800 focus:outline-hidden focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 transition-all shadow-xs disabled:opacity-50 cursor-pointer"
      >
        @if (isLoading()) {
          <svg
            class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span>Logowanie...</span>
        } @else {
          <span>Zaloguj się</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        }
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200 dark:border-zinc-800"></div>
      </div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-white dark:bg-zinc-900 px-2 text-gray-400">
          lub szybki dostęp
        </span>
      </div>
    </div>

    <!-- Quick Demo Access -->
    <button
      type="button"
      (click)="useDemoAccount()"
      class="w-full flex items-center justify-between p-3 rounded-xl border border-dashed border-sky-300 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-950/30 hover:bg-sky-50 dark:hover:bg-sky-950/50 transition-colors text-left cursor-pointer group"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center font-bold text-xs"
        >
          JK
        </div>
        <div>
          <p class="text-xs font-semibold text-gray-900 dark:text-gray-100 group-hover:text-sky-600 dark:group-hover:text-sky-400">
            Jan Kowalski (Demo)
          </p>
          <p class="text-[11px] text-gray-500 dark:text-gray-400">
            Kierownik Projektu &bull; jan.kowalski&#64;example.com
          </p>
        </div>
      </div>
      <span class="text-xs font-medium text-sky-600 dark:text-sky-400">
        Użyj konta &rarr;
      </span>
    </button>
  </div>
</div>
