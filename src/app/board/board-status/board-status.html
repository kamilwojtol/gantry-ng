<div
  class="flex flex-col bg-gray-50 dark:bg-zinc-900 rounded-xl border border-gray-200 dark:border-zinc-800 p-4 shadow-xs"
>
  <div
    class="flex items-center justify-between mb-4 pb-2 border-b border-gray-200 dark:border-zinc-800"
  >
    <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">{{ status() }}</h2>
    <span
      class="text-xs font-medium px-2 py-0.5 rounded-full bg-gray-200 dark:bg-zinc-800 text-gray-600 dark:text-gray-400"
    >
      {{ tasks().length }}
    </span>
  </div>

  <div
    cdkDropList
    [id]="status()"
    [cdkDropListData]="tasks()"
    (cdkDropListDropped)="taskDropped.emit($event)"
    class="flex-1 flex flex-col gap-2 min-h-37.5 rounded-lg transition-colors"
  >
    @for (task of tasks(); track task.id) {
      <app-board-task [task]="task" />
    } @empty {
      <div
        class="flex-1 flex items-center justify-center border-2 border-dashed border-gray-200 dark:border-zinc-800 rounded-lg p-6 text-gray-400 dark:text-zinc-500 text-xs text-center select-none"
      >
        Brak zadań w tej kolumnie
      </div>
    }
  </div>
</div>
