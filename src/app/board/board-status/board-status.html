<div class="w-50 flex flex-col justify-center items-center border border-gray-300 rounded p-4 m-2">
  <h2 class="text-lg font-bold">{{ title() }}</h2>
  <div
    class="flex flex-col"
    cdkDropList
    [cdkDropListData]="tasks() ?? []"
    (cdkDropListDropped)="drop($event)"
  >
    @for (task of tasks(); track task.id) {
      <app-board-task [task]="task" />
    }
  </div>
</div>
