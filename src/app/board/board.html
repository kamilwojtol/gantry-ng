<div cdkDropListGroup class="w-full min-h-screen p-6 bg-gray-100 dark:bg-zinc-950">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto items-start">
    @for (column of columns; track column.status) {
      <app-board-status
        [status]="column.status"
        [tasks]="column.tasks()"
        (taskDropped)="drop($event)"
      />
    }
  </div>
</div>
