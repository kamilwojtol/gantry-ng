<div class="flex justify-center align-items w-screen h-screen gap-4 p-4">
  <mat-grid-list cols="3" rowHeight="1:1" gutterSize="16px" class="w-full h-full">
    <mat-grid-tile>
      <app-board-status
        title="To do"
        [tasks]="todoTasks"
        cdkDropListGroup
        #listOne="cdkDropList"
        [cdkDropListConnectedTo]="[listTwo]"
      />
    </mat-grid-tile>
    <mat-grid-tile>
      <app-board-status
        title="In progress"
        [tasks]="inProgressTasks"
        cdkDropListGroup
        #listTwo="cdkDropList"
        [cdkDropListConnectedTo]="[listOne, listThree]"
      />
    </mat-grid-tile>
    <mat-grid-tile>
      <app-board-status
        title="Done"
        [tasks]="doneTasks"
        cdkDropListGroup
        #listThree="cdkDropList"
        [cdkDropListConnectedTo]="[listOne, listTwo]"
      />
    </mat-grid-tile>
  </mat-grid-list>
</div>
