<div
  class="flex flex-col gap-1 p-3 bg-white dark:bg-zinc-800 rounded-lg border border-gray-200 dark:border-zinc-700 shadow-xs hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing"
  cdkDrag
  [cdkDragData]="task()"
>
  <p class="font-medium text-sm text-gray-900 dark:text-gray-100">{{ task().title }}</p>
  @if (task().description) {
    <p class="text-xs text-gray-500 dark:text-gray-400">{{ task().description }}</p>
  }
</div>
